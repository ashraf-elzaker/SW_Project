name: CI (Backend + Frontend)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r The_project_back/requirements.txt
      - name: Run Django tests
        working-directory: The_project_back
        run: python manage.py test

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: The_project_front/buyer/package-lock.json

      - name: Install frontend dependencies
        working-directory: The_project_front/buyer
        run: npm ci

      - name: Run frontend build
        working-directory: The_project_front/buyer
        run: npm run build

      - name: Run frontend lint
        working-directory: The_project_front/buyer
        run: npm run lint
name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r The_project_back/requirements.txt
      - name: Run Django tests
        working-directory: The_project_back
        run: python manage.py test
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install frontend dependencies
        working-directory: The_project_front
        run: npm install
      - name: Run frontend build
        working-directory: The_project_front
        run: npm run build
      - name: Run frontend lint
        working-directory: The_project_front
        run: npm run lint
