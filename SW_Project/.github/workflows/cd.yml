name: CD - Build & Push Images

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-backend:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-frontend:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-frontend:${{ github.sha }}

      - name: Deployment step (placeholder)
        run: echo "Add deployment (SSH/Kubernetes/etc.) here or trigger environment"

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 120s
          script: |
            set -e
            echo "Logging into GHCR"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            echo "Pulling images"
            docker pull ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-backend:latest || true
            docker pull ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-frontend:latest || true
            echo "Changing to deploy dir"
            cd "${{ secrets.DEPLOY_DIR }}" || exit 1
            echo "Updating compose and restarting"
            docker-compose -f "${{ secrets.DOCKER_COMPOSE_FILE }}" pull
            docker-compose -f "${{ secrets.DOCKER_COMPOSE_FILE }}" up -d --remove-orphans

