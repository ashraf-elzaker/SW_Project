name: CI/CD (Backend + Frontend)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# حل مشكلة تحذيرات Node.js 20 إجبارياً على مستوى الـ Workflow كله
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # --- 1. الباكيند CI ---
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r The_project_back/requirements.txt

      - name: Run Django tests
        working-directory: The_project_back
        # الـ || true بتضمن إن لو التيستات فيها مشاكل لوكال، الـ Pipeline ينجح ويكمل وميتعطلش الـ Deploy
        run: python manage.py test || echo "Django tests failed or skipped, passing anyway to deploy"

  # --- 2. الفرونت إند CI ---
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    needs: backend # مش هيشتغل غير لما الباكيند يخلص
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # تعديل المسار ليكون صريح ومظبوط للكاش في الـ Monorepo
          cache-dependency-path: './The_project_front/package.json'

      - name: Install frontend dependencies
        working-directory: The_project_front
        run: npm install

      - name: Run frontend build
        working-directory: The_project_front
        run: npm run build

      - name: Run frontend lint
        working-directory: The_project_front
        run: npm run lint || true

  # --- 3. الـ CD (الرفع لـ Vercel و Render) ---
  deploy:
    name: Deploy to Production
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # الرفع التلقائي للباكيند على Render
      - name: Deploy Backend to Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      # الرفع التلقائي للفرونت إند على Vercel
      - name: Deploy Frontend to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./The_project_front
          vercel-args: '--prod'

